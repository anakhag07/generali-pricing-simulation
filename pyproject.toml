[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generali-pricing-simulation"
version = "0.1.0"
description = "Pricing simulation and optimization demo using Stein gradient estimators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10", "wandb>=0.19", "pandas>=1.5", "pyarrow>=14.0", "scikit-learn>=1.0", "xgboost>=1.7", "jax>=0.4.30"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pdoc>=16.0"]
jax-cuda12 = ["jax[cuda12]>=0.4.30"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
